<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header id="navbar">
  <h1>My Portfolio</h1>
  <button onclick="toggleDarkMode()">🌙</button>
</header>

<nav>
  <a href="#home">Home</a>
  <a href="#about">About</a>
  <a href="#achievements">Achievements</a>
  <a href="#projects">Projects</a>
  <a href="#skills">Skills</a>
  <a href="#gallery">Gallery</a>
  <a href="#contact">Contact</a>
</nav>

<section id="home" class="fade">
  <img src="images/profile.jpg" class="profile">
  <h2 id="typing"></h2>
</section>

<section id="about" class="fade">
  <h2>About Me</h2>
  <p>I am a passionate student learning web development and AI.</p>
</section>

<section id="achievements" class="fade">
  <h2>Achievements</h2>
  <div class="card">AI4A Project</div>
  <div class="card">Coursera Certificate</div>
</section>

<section id="projects" class="fade">
  <h2>Projects</h2>
  <div class="card">Portfolio Website</div>
</section>

<section id="skills" class="fade">
  <h2>Skills</h2>

  <div class="skill">
    <p>HTML</p>
    <div class="bar"><div style="width:90%"></div></div>
  </div>

  <div class="skill">
    <p>CSS</p>
    <div class="bar"><div style="width:80%"></div></div>
  </div>

  <div class="skill">
    <p>JavaScript</p>
    <div class="bar"><div style="width:70%"></div></div>
  </div>

</section>

<section id="gallery" class="fade">
  <h2>Gallery</h2>
  <img src="images/cert1.jpg" onclick="openImage(this)">
  <img src="images/cert2.jpg" onclick="openImage(this)">
</section>

<section id="contact" class="fade">
  <h2>Contact</h2>
  <button class="btn">Email Me</button>
</section>

<div id="popup" onclick="closeImage()">
  <img id="popup-img">
</div>

<script src="script.js"></script>
</body>
</html>
